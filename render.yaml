# ==============================================================================
# JustBaddo Platform — Render Infrastructure Blueprint (render.yaml)
# Automated deployment configuration for Render Web Service + PostgreSQL
# ==============================================================================

databases:
  - name: justbaddo-db
    databaseName: justbaddo_db
    user: justbaddo_user
    plan: free
    region: oregon

services:
  - type: web
    name: justbaddo
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: justbaddo-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"
