# ==============================================================================
# JustBaddo - Production Docker Compose Stack
# Multi-container stack: PostgreSQL 18, Gunicorn/Django, Nginx Reverse Proxy & Certbot
# ==============================================================================

services:
  db:
    image: postgres:18-alpine
    container_name: justbaddo_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-justbaddo_db}
      POSTGRES_USER: ${POSTGRES_USER:-justbaddo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-justbaddo_user} -d ${POSTGRES_DB:-justbaddo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - justbaddo_internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: justbaddo_prod_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_prod_data:/app/staticfiles
      - media_prod_data:/app/media
      - app_logs:/app/logs
    networks:
      - justbaddo_internal
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: justbaddo_prod_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - static_prod_data:/var/www/justbaddo/staticfiles:ro
      - media_prod_data:/var/www/justbaddo/media:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_challenge:/var/www/certbot:ro
    networks:
      - justbaddo_internal
      - justbaddo_public

  certbot:
    image: certbot/certbot:latest
    container_name: justbaddo_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_challenge:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - justbaddo_public

volumes:
  postgres_prod_data:
  static_prod_data:
  media_prod_data:
  app_logs:
  certbot_certs:
  certbot_challenge:

networks:
  justbaddo_internal:
    internal: true
  justbaddo_public:
    driver: bridge
