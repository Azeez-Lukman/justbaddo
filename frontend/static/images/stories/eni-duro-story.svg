<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="eniGlow" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#1c130d"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="lightZinc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#eniGlow)"/>

  <!-- Urban Grid Background -->
  <g opacity="0.08" stroke="#f59e0b" stroke-width="1">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600"/>
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675"/>
  </g>

  <!-- Ambient Soundwave Bars in Background -->
  <g opacity="0.22" fill="#f59e0b">
    <rect x="750" y="320" width="8" height="120" rx="4"/>
    <rect x="770" y="270" width="8" height="170" rx="4"/>
    <rect x="790" y="230" width="8" height="210" rx="4"/>
    <rect x="810" y="190" width="8" height="250" rx="4"/>
    <rect x="830" y="240" width="8" height="200" rx="4"/>
    <rect x="850" y="290" width="8" height="150" rx="4"/>
    <rect x="870" y="210" width="8" height="230" rx="4"/>
    <rect x="890" y="260" width="8" height="180" rx="4"/>
    <rect x="910" y="310" width="8" height="130" rx="4"/>
    <rect x="930" y="280" width="8" height="160" rx="4"/>
    <rect x="950" y="220" width="8" height="220" rx="4"/>
    <rect x="970" y="340" width="8" height="100" rx="4"/>
  </g>

  <!-- Geometric Accents -->
  <rect x="60" y="60" width="1080" height="555" rx="20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3"/>
  <rect x="72" y="72" width="1056" height="531" rx="16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08"/>

  <!-- Tag / Category Badge -->
  <g transform="translate(110, 130)">
    <rect width="180" height="34" rx="17" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#f59e0b">HIP-HOP HISTORY</text>
  </g>

  <!-- Big Typography -->
  <text x="110" y="250" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="68" letter-spacing="6" fill="url(#neonAmber)" filter="url(#glowFilter)">ENI DURO</text>
  <text x="110" y="330" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" letter-spacing="2" fill="url(#lightZinc)">THE BREAKTHROUGH REVOLUTION</text>

  <!-- Excerpt Teaser -->
  <text x="110" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="19" fill="#a1a1aa">
    <tspan x="110" dy="0">How a relentless voice from Bariga and a gritty one-take video</tspan>
    <tspan x="110" dy="30">saved faith in indigenous African street hip-hop.</tspan>
  </text>

  <!-- Author & Metadata Footnote -->
  <g transform="translate(110, 520)">
    <line x1="0" y1="0" x2="980" y2="0" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="20" cy="30" r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="20" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#f59e0b">B</text>
    <text x="50" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#f4f4f5">Dr. Biodun Ogundipe</text>
    <text x="230" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="13" fill="#71717a">• Ethnomusicologist</text>
    <text x="980" y="35" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#f59e0b">JUSTBADDO CHRONICLES</text>
  </g>
</svg>