<!-- ==========================================
     JUSTBADDO PERSISTENT MUSIC PLAYER COMPONENT
     To be included on every page before closing </body>
     ========================================== -->

<!-- Persistent Bottom Player Bar -->
<div id="jb-persistent-player" class="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 border-t border-zinc-800/80 backdrop-blur-xl transition-all duration-300">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 h-20 flex items-center justify-between gap-2 sm:gap-4">
    
    <!-- Left: Track Metadata -->
    <div class="flex items-center gap-2.5 sm:gap-3.5 min-w-0 flex-1 max-w-[45%] sm:max-w-none sm:w-1/3">
      <div class="relative w-10 h-10 sm:w-12 sm:h-12 rounded-lg sm:rounded-xl overflow-hidden shrink-0 bg-zinc-900 border border-zinc-800 cursor-pointer jb-player-expand-btn group">
        <img src="/static/images/defaults/default-album-cover.svg" alt="Current Track" class="jb-player-cover w-full h-full object-cover group-hover:scale-105 transition-transform">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
          <i data-lucide="maximize-2" class="w-4 h-4 text-white"></i>
        </div>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <h4 class="jb-player-title text-xs sm:text-sm font-bold text-zinc-100 truncate cursor-pointer hover:text-amber-400 transition-colors jb-player-expand-btn">Metaverse</h4>
          <span class="jb-player-status-badge hidden lg:inline-block text-[9px] uppercase tracking-wider font-semibold px-1.5 py-0.5 rounded-full border bg-amber-950 text-amber-400 border-amber-800 shrink-0">Preview</span>
        </div>
        <p class="jb-player-artist text-[11px] sm:text-xs text-zinc-400 truncate">Olamide</p>
      </div>
    </div>

    <!-- Center: Playback Controls & Progress Bar -->
    <div class="flex flex-col items-center justify-center shrink-0 sm:flex-1 sm:max-w-lg">
      <div class="flex items-center gap-2.5 sm:gap-6 mb-1 sm:mb-1.5">
        <button class="jb-player-shuffle-btn hidden sm:inline-flex text-zinc-400 hover:text-amber-400 transition-colors p-1" title="Shuffle" aria-label="Toggle Shuffle">
          <i data-lucide="shuffle" class="w-4 h-4"></i>
        </button>
        <button class="jb-player-prev-btn text-zinc-300 hover:text-white transition-colors p-1" title="Previous Track" aria-label="Previous Track">
          <i data-lucide="skip-back" class="w-4 h-4"></i>
        </button>
        <button class="jb-play-pause-btn w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-500 hover:bg-amber-400 text-black flex items-center justify-center transition-all transform hover:scale-105 shadow-md shadow-amber-500/20 shrink-0" title="Play/Pause" aria-label="Play">
          <i data-lucide="play" class="jb-play-pause-icon w-4 h-4 fill-current"></i>
        </button>
        <button class="jb-player-next-btn text-zinc-300 hover:text-white transition-colors p-1" title="Next Track" aria-label="Next Track">
          <i data-lucide="skip-forward" class="w-4 h-4"></i>
        </button>
        <button class="jb-player-repeat-btn hidden sm:inline-flex relative text-zinc-400 hover:text-amber-400 transition-colors p-1" title="Repeat" aria-label="Toggle Repeat">
          <i data-lucide="repeat" class="w-4 h-4"></i>
          <span class="jb-repeat-badge hidden absolute -top-1 -right-1 text-[8px] font-bold text-amber-400"></span>
        </button>
      </div>

      <!-- Scrubber Bar -->
      <div class="w-full flex items-center gap-1.5 sm:gap-3 text-[10px] sm:text-[11px] font-mono text-zinc-400">
        <span class="jb-player-current-time w-7 sm:w-8 text-right shrink-0">0:00</span>
        <div class="relative flex-1 flex items-center min-w-[50px]">
          <input type="range" min="0" max="100" value="0" step="0.1" class="jb-progress-slider w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer" aria-label="Track Progress">
        </div>
        <span class="jb-player-duration w-7 sm:w-8 shrink-0">2:47</span>
      </div>
    </div>

    <!-- Right: Utility Controls (Volume, Queue, Expand) -->
    <div class="flex items-center justify-end gap-1.5 sm:gap-4 shrink-0 sm:w-1/3">
      <button class="jb-player-like-btn hidden sm:inline-flex text-zinc-400 hover:text-rose-500 transition-colors p-1.5" title="Save Track" aria-label="Save Track">
        <i data-lucide="heart" class="w-4 h-4"></i>
      </button>

      <!-- Volume Control (desktop) -->
      <div class="hidden md:flex items-center gap-2 group">
        <button class="jb-volume-btn text-zinc-400 hover:text-white transition-colors" title="Mute/Unmute" aria-label="Mute">
          <i data-lucide="volume-2" class="jb-volume-icon w-4 h-4"></i>
        </button>
        <input type="range" min="0" max="1" step="0.01" value="0.7" class="jb-volume-slider w-16 h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer" aria-label="Volume">
      </div>

      <!-- Queue Drawer Button -->
      <button class="jb-player-queue-btn relative text-zinc-400 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-zinc-800 shrink-0" title="Play Queue" aria-label="View Queue">
        <i data-lucide="list-music" class="w-4 h-4"></i>
        <span class="jb-queue-count absolute -top-1 -right-1 w-4 h-4 rounded-full bg-amber-500 text-black text-[9px] font-bold flex items-center justify-center">1</span>
      </button>

      <!-- Expand Player Button -->
      <button class="jb-player-expand-btn text-zinc-400 hover:text-white transition-colors p-1.5 rounded-lg hover:bg-zinc-800 shrink-0" title="Expand Player" aria-label="Expand Player">
        <i data-lucide="maximize-2" class="w-4 h-4"></i>
      </button>
    </div>

  </div>
</div>

<!-- ==========================================
     EXPANDED PLAYER MODAL (Full View)
     ========================================== -->
<div id="jb-expanded-player-modal" class="jb-modal hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="jb-modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-md"></div>
  
  <div class="relative min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="relative w-full max-w-xl bg-zinc-900 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl overflow-hidden">
      
      <!-- Modal Top Bar -->
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-2">
          <span class="text-xs uppercase tracking-wider font-bold text-amber-500">JustBaddo Player</span>
          <span class="jb-player-status-badge text-[9px] uppercase tracking-wider font-semibold px-2 py-0.5 rounded-full border bg-amber-950 text-amber-400 border-amber-800">Preview</span>
        </div>
        <button class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition-colors" data-modal-close aria-label="Close expanded player">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Large Cover Art -->
      <div class="w-64 h-64 sm:w-72 sm:h-72 mx-auto rounded-2xl overflow-hidden shadow-2xl shadow-black/80 border border-zinc-800 mb-8 bg-zinc-950">
        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80" alt="Album Cover" class="jb-player-cover w-full h-full object-cover">
      </div>

      <!-- Track Information -->
      <div class="text-center mb-6">
        <h2 class="jb-player-title text-2xl font-bold text-zinc-100 mb-1">Metaverse</h2>
        <p class="jb-player-artist text-base text-zinc-400 mb-1">Olamide</p>
        <p class="jb-player-album text-xs text-amber-500/90 font-medium">Ikigai / 生き甲斐, Vol. 1</p>
      </div>

      <!-- Progress Slider -->
      <div class="mb-6">
        <div class="relative flex items-center mb-2">
          <input type="range" min="0" max="100" value="0" step="0.1" class="jb-progress-slider w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer" aria-label="Track progress slider">
        </div>
        <div class="flex justify-between text-xs font-mono text-zinc-400">
          <span class="jb-player-current-time">0:00</span>
          <span class="jb-player-duration">2:47</span>
        </div>
      </div>

      <!-- Expanded Player Controls -->
      <div class="flex items-center justify-center gap-6 mb-8">
        <button class="jb-player-shuffle-btn text-zinc-400 hover:text-amber-400 transition-colors p-2" aria-label="Toggle Shuffle">
          <i data-lucide="shuffle" class="w-5 h-5"></i>
        </button>
        <button class="jb-player-prev-btn text-zinc-300 hover:text-white transition-colors p-2" aria-label="Previous track">
          <i data-lucide="skip-back" class="w-6 h-6"></i>
        </button>
        <button class="jb-play-pause-btn w-14 h-14 rounded-full bg-amber-500 hover:bg-amber-400 text-black flex items-center justify-center transition-all transform hover:scale-105 shadow-xl shadow-amber-500/25" aria-label="Play or pause">
          <i data-lucide="play" class="jb-play-pause-icon w-6 h-6 fill-current"></i>
        </button>
        <button class="jb-player-next-btn text-zinc-300 hover:text-white transition-colors p-2" aria-label="Next track">
          <i data-lucide="skip-forward" class="w-6 h-6"></i>
        </button>
        <button class="jb-player-repeat-btn relative text-zinc-400 hover:text-amber-400 transition-colors p-2" aria-label="Toggle Repeat">
          <i data-lucide="repeat" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Bottom Actions in Modal -->
      <div class="flex items-center justify-between pt-6 border-t border-zinc-800 text-sm">
        <button class="jb-player-like-btn flex items-center gap-2 text-zinc-400 hover:text-rose-500 transition-colors">
          <i data-lucide="heart" class="w-4 h-4"></i>
          <span>Save to Library</span>
        </button>
        <button class="flex items-center gap-2 text-zinc-400 hover:text-amber-400 transition-colors" onclick="JustBaddoPlaylists.openAddToPlaylistModal(JustBaddoState.state.player.currentTrack?.id)">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span>Add to Playlist</span>
        </button>
      </div>

    </div>
  </div>
</div>

<!-- ==========================================
     ACTIVE QUEUE DRAWER (Right Flyout)
     ========================================== -->
<div id="jb-queue-drawer" class="jb-modal hidden fixed inset-0 z-50 overflow-hidden">
  <div class="jb-modal-backdrop fixed inset-0 bg-black/60 backdrop-blur-sm"></div>

  <div class="fixed inset-y-0 right-0 max-w-md w-full bg-zinc-900 border-l border-zinc-800 shadow-2xl flex flex-col z-10 animate-fadeIn">
    <!-- Drawer Header -->
    <div class="p-6 border-b border-zinc-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <i data-lucide="list-music" class="w-5 h-5 text-amber-500"></i>
        <h3 class="text-lg font-bold text-zinc-100">Playback Queue</h3>
        <span class="jb-queue-count text-xs px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-300 font-mono">1</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="jb-clear-queue-btn" class="text-xs text-zinc-400 hover:text-rose-400 transition-colors px-2 py-1">Clear</button>
        <button class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition-colors" data-modal-close aria-label="Close queue">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Queue Tracks List -->
    <div id="jb-queue-list" class="flex-1 overflow-y-auto p-4 space-y-2">
      <!-- Injected dynamically by queue.js -->
    </div>

    <!-- Drawer Footer Notice -->
    <div class="p-4 border-t border-zinc-800/80 bg-zinc-950/60 text-xs text-zinc-500 flex items-center gap-2">
      <i data-lucide="info" class="w-4 h-4 shrink-0 text-amber-500"></i>
      <span>Demonstration player queue. State persists across page navigation.</span>
    </div>
  </div>
</div>

<!-- ==========================================
     ADD TO PLAYLIST MODAL
     ========================================== -->
<div id="jb-add-to-playlist-modal" class="jb-modal hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="jb-modal-backdrop fixed inset-0 bg-black/75 backdrop-blur-sm"></div>

  <div class="relative min-h-screen flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold text-zinc-100">Add to Playlist</h3>
        <button class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition-colors" data-modal-close>
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="jb-add-to-playlist-items" class="space-y-2 mb-6 max-h-60 overflow-y-auto">
        <!-- Rendered by playlists.js -->
      </div>

      <div class="pt-4 border-t border-zinc-800">
        <h4 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Or Create New Playlist</h4>
        <div class="space-y-3">
          <input type="text" id="jb-new-playlist-title" placeholder="Playlist title (e.g., Street Anthems)" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3 py-2 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none">
          <input type="text" id="jb-new-playlist-desc" placeholder="Optional description" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3 py-2 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none">
          <button id="jb-create-playlist-btn" class="w-full py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors">
            Create & Add Track
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
