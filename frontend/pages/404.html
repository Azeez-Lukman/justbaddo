<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — JUSTBADDO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="bg-[#070809] text-zinc-100 min-h-screen flex flex-col justify-between antialiased selection:bg-amber-500 selection:text-black">

  <header class="p-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2 group">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50 group-hover:scale-125 transition-transform"></span>
      <span class="font-display font-black text-xl tracking-wider text-white">JUST<span class="text-amber-500">BADDO</span></span>
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center p-6 text-center">
    <div class="max-w-md space-y-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-amber-500/10 border border-amber-500/30 text-amber-500 mb-2">
        <i data-lucide="disc-3" class="w-10 h-10 animate-spin" style="animation-duration: 8s;"></i>
      </div>
      
      <h1 class="font-display text-4xl sm:text-5xl font-black text-white">Track Not Found</h1>
      <p class="text-xs sm:text-sm text-zinc-400 leading-relaxed">
        The record or page you're searching for seems to have skipped a beat or hasn't dropped on JustBaddo yet.
      </p>

      <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
        <a href="../index.html" class="px-6 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors">
          Return to Home
        </a>
        <a href="music.html" class="px-6 py-3 rounded-xl border border-zinc-700 hover:border-zinc-500 text-zinc-200 font-semibold text-xs transition-colors">
          Browse Discography
        </a>
      </div>
    </div>
  </main>

  <footer class="p-6 text-center text-xs text-zinc-500">
    © 2024–2026 JustBaddo. Built for fans worldwide.
  </footer>

  <script src="../static/js/core/ui.js"></script>
  <script src="../static/js/core/app.js"></script>
</body>
</html>
