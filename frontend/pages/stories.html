<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fan Stories & Essays — JUSTBADDO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="bg-[#070809] text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-black pb-player-safe">

  <!-- ================= TOP NAVIGATION ================= -->
  <header class="sticky top-0 z-30 bg-[#070809]/90 border-b border-zinc-800/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-8">
        <a href="../index.html" class="flex items-center gap-2 group">
          <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50 group-hover:scale-125 transition-transform"></span>
          <span class="font-display font-black text-xl tracking-wider text-white">JUST<span class="text-amber-500">BADDO</span></span>
        </a>
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
          <a href="../index.html" class="jb-nav-link text-zinc-400 hover:text-zinc-100 transition-colors">Home</a>
          <a href="music.html" class="jb-nav-link text-zinc-400 hover:text-zinc-100 transition-colors">Music</a>
          <a href="community.html" class="jb-nav-link text-zinc-400 hover:text-zinc-100 transition-colors">Community</a>
          <a href="fan-arena.html" class="jb-nav-link text-zinc-400 hover:text-zinc-100 transition-colors">Fan Arena</a>
          <a href="stories.html" class="jb-nav-link text-amber-400 font-semibold transition-colors">Stories</a>
          <a href="timeline.html" class="jb-nav-link text-zinc-400 hover:text-zinc-100 transition-colors">Timeline</a>
        </nav>
      </div>

      <div class="flex items-center gap-3">
        <a href="search.html" class="p-2 text-zinc-400 hover:text-white rounded-xl hover:bg-zinc-800 transition-colors">
          <i data-lucide="search" class="w-5 h-5"></i>
        </a>
        <a href="dashboard.html" class="p-1 rounded-full border border-zinc-800 hover:border-amber-500/50 transition-colors">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-8 h-8 rounded-full object-cover">
        </a>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 py-10 w-full">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-10 pb-6 border-b border-zinc-800">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-400 text-xs font-semibold mb-2">
          <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
          <span>Long-form Community Chronicles</span>
        </div>
        <h1 class="font-display text-3xl font-black text-white">Fan Stories & Essays</h1>
        <p class="text-xs sm:text-sm text-zinc-400 mt-1">Concert memories, cultural essays, and deeply personal reflections from Olamide listeners worldwide.</p>
      </div>
      <button class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors flex items-center gap-2 self-start sm:self-auto" onclick="JustBaddoUI.openModal('jb-submit-story-modal')">
        <i data-lucide="feather" class="w-4 h-4"></i>
        <span>Submit Your Story</span>
      </button>
    </div>

    <!-- Stories Grid -->
    <div id="jb-stories-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-14">
      <!-- Rendered dynamically by stories-page.js -->
    </div>

  </main>

  <!-- Story Reader Modal -->
  <div id="jb-story-reader-modal" class="jb-modal hidden fixed inset-0 z-50 overflow-y-auto">
    <div class="jb-modal-backdrop fixed inset-0 bg-black/85 backdrop-blur-md"></div>
    <div class="relative min-h-screen flex items-center justify-center p-4 sm:p-6">
      <div class="relative w-full max-w-2xl bg-zinc-900 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
        <button class="absolute top-4 right-4 text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-800 transition-colors" data-modal-close>
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        <div class="aspect-video rounded-2xl overflow-hidden mb-6 bg-zinc-950">
          <img id="jb-reader-cover" src="" alt="Story Cover" class="w-full h-full object-cover">
        </div>
        <div class="mb-4">
          <span id="jb-reader-date" class="text-xs text-amber-500 font-mono block mb-1"></span>
          <h2 id="jb-reader-title" class="font-display text-2xl font-black text-white leading-tight mb-2"></h2>
          <p id="jb-reader-author" class="text-xs text-zinc-400 font-semibold"></p>
        </div>
        <div id="jb-reader-content" class="text-sm leading-relaxed text-zinc-300 border-t border-zinc-800/80 pt-4 mb-6"></div>
        <div class="flex items-center justify-between pt-4 border-t border-zinc-800 text-xs">
          <span class="text-zinc-500">Curated on JustBaddo</span>
          <button class="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-200 hover:bg-zinc-700 font-medium" data-modal-close>Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Submit Story Modal -->
  <div id="jb-submit-story-modal" class="jb-modal hidden fixed inset-0 z-50 overflow-y-auto">
    <div class="jb-modal-backdrop fixed inset-0 bg-black/80 backdrop-blur-sm"></div>
    <div class="relative min-h-screen flex items-center justify-center p-4">
      <div class="relative w-full max-w-lg bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-zinc-100">Submit Your Fan Memory</h3>
          <button class="text-zinc-400 hover:text-white" data-modal-close><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <form id="jb-submit-story-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Title</label>
            <input type="text" id="jb-story-submit-title" placeholder="e.g. My First Time Attending OLIC in Lagos" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none" required>
          </div>
          <div>
            <label class="block text-xs font-semibold text-zinc-400 mb-1">Story Content</label>
            <textarea id="jb-story-submit-content" rows="6" placeholder="Share your experience, how the album touched you, or what Baddo's music meant during that chapter of your life..." class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl p-3 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none" required></textarea>
          </div>
          <div class="flex items-center justify-end gap-3 pt-3 border-t border-zinc-800">
            <button type="button" class="px-4 py-2 rounded-xl text-zinc-400 hover:text-white text-xs" data-modal-close>Cancel</button>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors">Submit Story</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Persistent Player -->
  <div id="jb-persistent-player" class="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 border-t border-zinc-800/80 backdrop-blur-xl transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3.5 min-w-0 w-1/4 sm:w-1/3">
        <div class="relative w-12 h-12 rounded-xl overflow-hidden shrink-0 bg-zinc-900 border border-zinc-800 cursor-pointer jb-player-expand-btn group">
          <img src="" alt="Cover" class="jb-player-cover w-full h-full object-cover">
        </div>
        <div class="min-w-0">
          <h4 class="jb-player-title text-sm font-bold text-zinc-100 truncate cursor-pointer hover:text-amber-400 transition-colors jb-player-expand-btn"></h4>
          <p class="jb-player-artist text-xs text-zinc-400 truncate"></p>
        </div>
      </div>
      <div class="flex flex-col items-center max-w-lg w-full flex-1">
        <div class="flex items-center gap-5 sm:gap-6 mb-1.5">
          <button class="jb-player-prev-btn text-zinc-300 hover:text-white p-1"><i data-lucide="skip-back" class="w-4 h-4"></i></button>
          <button class="jb-play-pause-btn w-9 h-9 rounded-full bg-amber-500 hover:bg-amber-400 text-black flex items-center justify-center"><i data-lucide="play" class="jb-play-pause-icon w-4 h-4 fill-current"></i></button>
          <button class="jb-player-next-btn text-zinc-300 hover:text-white p-1"><i data-lucide="skip-forward" class="w-4 h-4"></i></button>
        </div>
        <div class="w-full flex items-center gap-3 text-[11px] font-mono text-zinc-400">
          <span class="jb-player-current-time w-8 text-right">0:00</span>
          <input type="range" min="0" max="100" value="0" step="0.1" class="jb-progress-slider w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
          <span class="jb-player-duration w-8">0:00</span>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 sm:gap-4 w-1/4 sm:w-1/3">
        <button class="jb-player-like-btn text-zinc-400 hover:text-rose-500 p-1.5"><i data-lucide="heart" class="w-4 h-4"></i></button>
        <button class="jb-player-queue-btn relative text-zinc-400 hover:text-white p-1.5"><i data-lucide="list-music" class="w-4 h-4"></i><span class="jb-queue-count absolute -top-1 -right-1 w-4 h-4 rounded-full bg-amber-500 text-black text-[9px] font-bold flex items-center justify-center">1</span></button>
      </div>
    </div>
  </div>

  <div id="jb-queue-drawer" class="jb-modal hidden fixed inset-0 z-50 overflow-hidden">
    <div class="jb-modal-backdrop fixed inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="fixed inset-y-0 right-0 max-w-md w-full bg-zinc-900 border-l border-zinc-800 shadow-2xl flex flex-col z-10 animate-fadeIn">
      <div class="p-6 border-b border-zinc-800 flex items-center justify-between">
        <h3 class="text-lg font-bold text-zinc-100">Playback Queue</h3>
        <button class="text-zinc-400 hover:text-white" data-modal-close><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="jb-queue-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    </div>
  </div>

  <script src="../static/js/data/catalogue.js"></script>
  <script src="../static/js/data/community-data.js"></script>
  <script src="../static/js/data/arena-data.js"></script>
  <script src="../static/js/data/stories-data.js"></script>
  <script src="../static/js/data/timeline-data.js"></script>
  
  <script src="../static/js/core/storage.js"></script>
  <script src="../static/js/core/state.js"></script>
  <script src="../static/js/core/ui.js"></script>
  
  <script src="../static/js/music/provider-interface.js"></script>
  <script src="../static/js/music/mock-provider.js"></script>
  <script src="../static/js/music/player.js"></script>
  <script src="../static/js/music/queue.js"></script>
  <script src="../static/js/music/playlists.js"></script>
  
  <script src="../static/js/pages/stories-page.js"></script>
  <script src="../static/js/core/app.js"></script>
</body>
</html>
