<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JUSTBADDO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="bg-[#070809] text-zinc-100 min-h-screen flex flex-col justify-between antialiased selection:bg-amber-500 selection:text-black">

  <!-- Minimal Brand Header -->
  <header class="p-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2 group">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50 group-hover:scale-125 transition-transform"></span>
      <span class="font-display font-black text-xl tracking-wider text-white">JUST<span class="text-amber-500">BADDO</span></span>
    </a>
    <a href="../index.html" class="text-xs text-zinc-400 hover:text-white transition-colors">
      ← Back to Home
    </a>
  </header>

  <!-- Login Card Container -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md p-8 rounded-3xl bg-zinc-900/70 border border-zinc-800 shadow-2xl backdrop-blur-xl">
      
      <div class="text-center mb-8">
        <h1 class="font-display text-2xl sm:text-3xl font-black text-white mb-2">Welcome Back</h1>
        <p class="text-xs text-zinc-400">Sign in to access your curated playlists and community discussions.</p>
      </div>

      <form id="jb-login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="email" id="jb-login-email" value="fan@justbaddo.local" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl pl-10 pr-3 py-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none" required>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-zinc-300">Password</label>
            <a href="forgot-password.html" class="text-[11px] text-amber-500 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="password" id="jb-login-password" value="demonstration123" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl pl-10 pr-10 py-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none" required>
            <button type="button" id="jb-toggle-password" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 text-zinc-400 cursor-pointer">
            <input type="checkbox" checked class="w-3.5 h-3.5 accent-amber-500 rounded">
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors shadow-lg shadow-amber-500/20 mt-2">
          Sign In to Account
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-zinc-800/80 text-center text-xs text-zinc-400">
        Don't have an account yet? 
        <a href="register.html" class="text-amber-400 font-semibold hover:underline">Join the Community</a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-zinc-500">
    © 2024–2026 JustBaddo. Frontend Demonstration Prototype.
  </footer>

  <script src="../static/js/core/storage.js"></script>
  <script src="../static/js/core/state.js"></script>
  <script src="../static/js/core/ui.js"></script>
  <script src="../static/js/core/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle password visibility
      const toggleBtn = document.getElementById('jb-toggle-password');
      const passInput = document.getElementById('jb-login-password');
      if (toggleBtn && passInput) {
        toggleBtn.addEventListener('click', () => {
          const isPass = passInput.type === 'password';
          passInput.type = isPass ? 'text' : 'password';
          toggleBtn.querySelector('i').setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
          JustBaddoUI.refreshIcons();
        });
      }

      // Handle login demo submission
      const form = document.getElementById('jb-login-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          JustBaddoUI.toast('Signed in successfully! Redirecting to Dashboard...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);
        });
      }
    });
  </script>
</body>
</html>
