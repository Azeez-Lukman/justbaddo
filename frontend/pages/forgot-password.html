<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — JUSTBADDO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../static/css/styles.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
  <link rel="alternate icon" href="/static/images/favicon.ico">
</head>
<body class="bg-[#070809] text-zinc-100 min-h-screen flex flex-col justify-between antialiased selection:bg-amber-500 selection:text-black">

  <header class="p-6 max-w-7xl mx-auto w-full flex items-center justify-between">
    <a href="../index.html" class="flex items-center gap-2 group">
      <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shadow-sm shadow-amber-500/50 group-hover:scale-125 transition-transform"></span>
      <span class="font-display font-black text-xl tracking-wider text-white">JUST<span class="text-amber-500">BADDO</span></span>
    </a>
    <a href="login.html" class="text-xs text-zinc-400 hover:text-white transition-colors">
      ← Back to Sign In
    </a>
  </header>

  <main class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-md p-8 rounded-3xl bg-zinc-900/70 border border-zinc-800 shadow-2xl backdrop-blur-xl">
      
      <div class="text-center mb-8">
        <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-500 flex items-center justify-center mx-auto mb-4">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h1 class="font-display text-2xl font-black text-white mb-2">Reset Password</h1>
        <p class="text-xs text-zinc-400">Enter your registered email address and we will generate a recovery instruction.</p>
      </div>

      <form id="jb-forgot-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5">Email Address</label>
          <input type="email" id="jb-forgot-email" placeholder="you@domain.com" class="w-full bg-zinc-950 border border-zinc-800 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none" required>
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs transition-colors shadow-lg shadow-amber-500/20 mt-2">
          Send Recovery Link
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-zinc-800/80 text-center text-xs text-zinc-400">
        Remember your credentials? 
        <a href="login.html" class="text-amber-400 font-semibold hover:underline">Back to Sign In</a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-zinc-500">
    © 2024–2026 JustBaddo. Frontend Demonstration Prototype.
  </footer>

  <script src="../static/js/core/api-client.js"></script>
  <script src="../static/js/core/storage.js"></script>
  <script src="../static/js/core/state.js"></script>
  <script src="../static/js/core/ui.js"></script>
  <script src="../static/js/core/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('jb-forgot-form');
      const submitBtn = form ? form.querySelector('button[type="submit"]') : null;

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('jb-forgot-email').value.trim();

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="animate-pulse">Processing...</span>';
          }

          try {
            await JustBaddoApi.auth.requestPasswordReset(email);
            JustBaddoUI.toast('If the email is registered, a password recovery link has been dispatched.', 'success');
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } catch (err) {
            JustBaddoUI.toast(err.message || 'Unable to process password reset request.', 'error');
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = 'Send Recovery Link';
            }
          }
        });
      }
    });
  </script>
</body>
</html>
